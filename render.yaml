services:
  - type: web
    name: procureai
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm --prefix client install && npm --prefix client run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: procureai-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/procureai.db
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_RESET_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
